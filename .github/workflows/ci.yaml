name: Build LibrimeKit
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # NOTE (fork, 2026-11-24): do NOT enable submodules here. The pinned
        # boost-iosx commit d7517e2 no longer exists upstream (force-pushed
        # away), so a recursive submodule fetch fails with "not our ref".
        # Clone the submodules manually at valid refs in the next step.

      - name: Checkout submodules
        run: |
          git clone --depth 1 https://github.com/imfuxiao/boost-iosx.git boost-iosx
          git clone https://github.com/rime/librime.git librime
          git -C librime checkout 08dd95f5d9282346f0d4a3e8fc6b20811dc3d063

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          df -h /

      - name: Build Boost
        env:
          ICU4C_RELEASE_LINK: https://github.com/apotocki/icu4c-iosx/releases/download/79.1.3
        run: |
          make boost-build

      - name: Build Librime
        run: |
          make librime-build

      - name: Make Archive
        run: |
          tar -acf Frameworks.tgz Frameworks

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: librimekit-frameworks
          path: Frameworks.tgz

      # NOTE (fork, 2026-11-24): the v* tag is created through the GitHub web
      # UI's release flow, so the release already exists when this runs and
      # actions/create-release would fail with 422. Upload to the existing
      # release instead (--clobber makes re-runs idempotent). `gh` is
      # preinstalled on macos runners and picks up GITHUB_TOKEN.
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" Frameworks.tgz --clobber
